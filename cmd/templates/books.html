{{ define "main" }}
    <h1 class="title archive-title">Books I've read this year</h1>
    {{ range .Site.Books }}
        <article class="book">
            <a href="{{ .Link }}" target="_blank">
                <h2 class="title book-title">{{ .Title | html }}</h2>
            </a>
            <p class="book-meta">
                {{ if .Authors }}by {{ .Byline | html }} &middot; {{ end }}finished {{ .FormattedDate }}
            </p>
            {{ if .Rating }}
                <p class="book-rating" role="img" aria-label="Rated {{ .Rating }} out of 5">{{ .Stars }}</p>
            {{ end }}
        </article>
    {{ else }}
        <p>I haven't finished anything yet this year.</p>
    {{ end }}
{{ end }}
